<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Task Manager</h1>
        <button id="theme-toggle" class="btn">Switch to Dark Mode</button>
    </header>

    <main class="container">
        <!-- task creation & filtering Section -->
        <section class="controls-section">
            <div class="card">
                <h2>Add a New Task</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Task Title</label>
                        <input type="text" id="task-title" required placeholder="Enter task title...">
                    </div>
                    <div class="form-group">
                        <label for="task-category">Category</label>
                        <select id="task-category" required>
                            <option value="" disabled selected>Select category...</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="add-task-btn">Add Task</button>
                </form>
            </div>

            <!-- bonus: search and filter -->
            <div class="card filters-card">
                <h2>Filters & Stats</h2>
                <input type="text" id="search-task" placeholder="Search tasks...">
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                </select>
                <div class="stats">
                    <p>Total Tasks: <span id="total-count">0</span></p>
                    <p>Completed: <span id="completed-count">0</span></p>
                    <p>Pending: <span id="pending-count">0</span></p>
                </div>
                <button id="clear-all" class="btn btn-danger clear-all-btn">Clear All</button>
            </div>
        </section>

        <!-- tasks List Section -->
        <section class="tasks-section">
            <h2>Your Tasks</h2>
            <!-- The parent container for tasks -->
            <div id="task-list" class="task-list">
                <!-- Tasks will be injected here dynamically -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
